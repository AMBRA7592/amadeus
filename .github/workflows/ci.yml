name: proofs

# Low-cost insurance: every push and PR re-runs all eight zero-dependency
# scripts on the oldest and a current Python, so an outside contribution that
# breaks one of the proofs fails visibly instead of landing quietly.

on:
  push:
  pull_request:

jobs:
  run:
    name: run all proofs (py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # validates the README's "Python 3.8+" claim
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Diagnostic, exporter, record, spine, and four foundations
        run: |
          python3 disagreement.py   # writes triage.json
          python3 soft_labels.py    # consumes triage.json
          python3 resolution.py     # consumes triage + soft labels + governance
          python3 aggregation.py
          python3 frustration.py
          python3 topology.py
          python3 geometry.py
          python3 bayes_optimal.py
      - name: Validate the schema, example, and emitted records
        run: |
          python3 -m pip install --disable-pip-version-check "jsonschema==4.23.0"
          python3 - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker

          with open("schema/resolution_record.schema.json", encoding="utf-8") as f:
              schema = json.load(f)
          Draft202012Validator.check_schema(schema)
          with open("schema/labels.schema.json", encoding="utf-8") as f:
              labels_schema = json.load(f)
          Draft202012Validator.check_schema(labels_schema)
          with open("data/labels.json", encoding="utf-8") as f:
              Draft202012Validator(labels_schema).validate(json.load(f))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(schema["examples"][0])
          with open("resolution_records.jsonl", encoding="utf-8") as f:
              records = [json.loads(line) for line in f if line.strip()]
          assert len(records) == 18, len(records)
          for record in records:
              validator.validate(record)
          print("input schema/data valid; resolution schema/example/18 records valid")
          PY
      - name: Verified-claims suite (stdlib only)
        run: python3 -m unittest test_claims -v
